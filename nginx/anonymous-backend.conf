# =============================================================================
# Anonymous India — Nginx Reverse Proxy Config
# /etc/nginx/sites-available/anonymous-backend
#
# HTTP-only template — certbot will insert ssl block automatically
# Run: sudo bash scripts/setup-nginx.sh api.yourdomain.com
# =============================================================================

# Rate limiting zones
limit_req_zone  $binary_remote_addr zone=api:10m    rate=30r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m   rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Replace "_" with your actual domain (setup-nginx.sh does this automatically)
    server_name _;

    # Security headers
    add_header X-Frame-Options           "DENY"              always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "strict-origin"     always;

    # Gzip compression
    gzip              on;
    gzip_comp_level   4;
    gzip_min_length   1024;
    gzip_types        text/plain application/json application/javascript text/css;

    # Max body size (for file uploads to /storage)
    client_max_body_size 10M;

    # ---------------------------------------------------------------------------
    # WebSocket — Socket.IO real-time (must come before the generic / location).
    # The gateway is mounted at path '/ws' (see RealtimeGateway and the Flutter
    # client's setPath('/ws')); '/socket.io/' is kept for the default client path.
    # Without this block these requests fall through to `location /`, which has
    # no Upgrade headers and a 60s read timeout — the handshake fails silently.
    # ---------------------------------------------------------------------------
    location ~ ^/(ws|socket\.io)(/|$) {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # keep WS connections alive
        proxy_send_timeout 86400s;
    }

    # ---------------------------------------------------------------------------
    # Auth endpoints — stricter rate limit
    # ---------------------------------------------------------------------------
    location ~ ^/api/v[0-9]+/auth/ {
        limit_req  zone=auth burst=10 nodelay;
        limit_conn conn 5;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ---------------------------------------------------------------------------
    # General API
    # ---------------------------------------------------------------------------
    location / {
        limit_req  zone=api burst=50 nodelay;
        limit_conn conn 20;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------------------------------------------------------------------------
    # Block common attack paths
    # ---------------------------------------------------------------------------
    location ~ /\. { deny all; }
    location = /favicon.ico { access_log off; log_not_found off; }
}
